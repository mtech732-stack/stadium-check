<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<title>فحص الملاعب — الاتحاد الكويتي لكرة القدم</title>
<link rel="stylesheet" href="css/app.css?v=12">
<link rel="stylesheet" href="css/print.css?v=12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فحص الملاعب">
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="titlerow">
      <img class="crest" src="assets/kfa-logo.png" width="232" height="233"
           alt="شعار الاتحاد الكويتي لكرة القدم">
      <h1 id="appTitle">نموذج فحص واعتماد الملعب الرئيسي</h1>
      <button type="button" id="btnArchive">الأرشيف</button>
    </div>
    <div class="sub" id="count">0 من 37 بنداً</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="tally" id="tally"></div>
  </div>
</div>

<main>
  <div id="formNotice"></div>

  <section class="card">
    <header>
      <h2>بيانات الزيارة</h2>
    </header>
    <div class="body">
      <div class="fields" id="metaFields"></div>
    </div>
  </section>

  <div id="sections"></div>

  <section class="card">
    <header>
      <h2>القياسات والقراءات الأساسية</h2>
    </header>
    <div class="body" id="measBody"></div>
  </section>

  <section class="card">
    <header>
      <h2>التقييم العام وحالة الاعتماد</h2>
    </header>
    <div class="body" id="summaryBody"></div>
  </section>

  <p class="foot-link"><a href="editor.html">تعديل بنود النموذج ↗</a></p>
</main>

<div id="printView" aria-hidden="true"></div>

<div class="sheet" id="archive" hidden>
  <div class="sheet-box">
    <header>
      <h2>أرشيف التقارير</h2>
      <button type="button" id="archClose" aria-label="إغلاق">إغلاق</button>
    </header>
    <div class="sheet-body" id="archList"></div>
    <div class="build" id="buildInfo"></div>
    <footer>
      <button type="button" id="archNew">تقرير جديد</button>
      <button type="button" id="archExport">نسخة احتياطية</button>
      <button type="button" id="archImport">استيراد</button>
      <input type="file" id="archFile" accept="application/json,.json" hidden>
    </footer>
  </div>
</div>

<div class="actionbar">
  <span class="saved" id="savedAt">حُفظ تلقائياً</span>
  <button type="button" id="btnPreview">معاينة المطبوعة</button>
  <button type="button" id="btnPrint">طباعة / PDF</button>
</div>

<script src="js/data.js?v=12"></script>
<script src="js/form-store.js?v=12"></script>
<script src="js/app.js?v=12"></script>
<script src="js/print.js?v=12"></script>
<script src="js/archive.js?v=12"></script>
<script>
/* التخزين للعمل دون إنترنت — يُعطَّل على الحاسوب المحلّي أثناء التطوير
   كي لا تُقدَّم نسخة قديمة مخزّنة بدل الملفّات المعدَّلة. */
if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
